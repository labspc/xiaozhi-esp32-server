name: CI Guardrails

on:
  pull_request:
    branches:
      - orica-refactor
  push:
    branches:
      - orica-refactor

jobs:
  guardrails:
    runs-on: ubuntu-latest
    env:
      PYTHONWARNINGS: ignore
      OPENAPI_OUTPUT: openapi.json
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Python syntax check (core paths)
        run: |
          set -e
          python -m py_compile main/xiaozhi-server/app.py

      - name: Mojo audio smoke (optional)
        run: |
          set -e
          if [ -f scripts/mojo_smoke_ci.sh ]; then
            bash scripts/mojo_smoke_ci.sh
          else
            echo "Mojo smoke script missing; skipping"
          fi

      - name: Python lint (ruff minimal)
        run: |
          set -e
          pip install --disable-pip-version-check --no-input ruff==0.6.7
          # Disallow eval/exec and overly dynamic patterns in core
          ruff check main/xiaozhi-server || true
          # Fail if forbidden patterns found
          if rg "eval\(" main/xiaozhi-server; then echo "Found eval in Python"; exit 1; fi
          if rg "exec\(" main/xiaozhi-server; then echo "Found exec in Python"; exit 1; fi

      - name: Rust fmt/check (if cargo workspace exists)
        run: |
          set -e
          if [ -f Cargo.toml ]; then
            cargo fmt --check
            cargo check
          else
            echo "No Cargo.toml, skipping Rust checks"
          fi

      - name: Node lint (if package.json exists)
        run: |
          set -e
          if [ -f package.json ]; then
            npm install --prefer-offline --no-progress
            if npm run lint; then
              echo "JS lint passed"
            else
              echo "JS lint failed or missing"; exit 1;
            fi
          else
            echo "No package.json, skipping JS lint"
          fi

      - name: OpenAPI diff (placeholder)
        run: |
          set -e
          if [ -f scripts/generate_openapi.sh ]; then
            bash scripts/generate_openapi.sh > $OPENAPI_OUTPUT
            if [ -f openapi-baseline.json ]; then
              if ! diff -u openapi-baseline.json $OPENAPI_OUTPUT; then
                echo "OpenAPI diff detected"; exit 1;
              fi
            else
              echo "Baseline OpenAPI not found; skipping diff"
            fi
          else
            echo "OpenAPI generator script missing; skipping"
          fi

      - name: Forbidden patterns scan (baseline)
        run: |
          set -e
          # Rust: block unsafe/impl Trait/<T>/closures in src if present
          if [ -d src ]; then
            if rg "unsafe" src; then echo "Found unsafe in Rust code"; exit 1; fi
            if rg "impl\s+Trait" src; then echo "Found impl Trait"; exit 1; fi
            if rg "<[A-Za-z0-9_]+>" src; then echo "Found generics-like pattern"; exit 1; fi
            if rg "\|" src; then echo "Found possible closures"; exit 1; fi
          fi
          # Svelte/Vue: block context/actions/derived/composition API if not desired
          if [ -d web ] || [ -d main/manager-web ] || [ -d main/manager-mobile ]; then
            if rg "setContext|getContext|use:" .; then echo "Found forbidden Svelte/Vue actions/context"; exit 1; fi
            if rg "derived" .; then echo "Found forbidden derived stores"; exit 1; fi
            if rg "defineComponent" main/manager-web; then echo "Found Vue composition patterns"; exit 1; fi
          fi
          # Python: discourage eval/exec
          if rg "eval\(" main/xiaozhi-server; then echo "Found eval in Python"; exit 1; fi
          if rg "exec\(" main/xiaozhi-server; then echo "Found exec in Python"; exit 1; fi
